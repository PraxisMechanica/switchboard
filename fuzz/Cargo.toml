[package]
name = "switchboard-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
switchboard = { path = ".." }

[[bin]]
name = "decode_frame"
path = "fuzz_targets/decode_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_peer_card"
path = "fuzz_targets/verify_peer_card.rs"
test = false
doc = false
bench = false

[workspace]
