name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package tarball
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          OUT="switchboard-${TAG}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/switchboard" ./switchboard
          tar -czf "${OUT}" switchboard SKILL.md
          shasum -a 256 "${OUT}" > "${OUT}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            switchboard-*.tar.gz
            switchboard-*.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" \
            --title "Switchboard ${GITHUB_REF_NAME}" \
            --generate-notes \
            --clobber \
            switchboard-*.tar.gz SHA256SUMS.txt || \
          gh release upload "${GITHUB_REF_NAME}" \
            --clobber \
            switchboard-*.tar.gz SHA256SUMS.txt
